<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-back-button defaultHref="/home" />
    </ion-buttons>
    <ion-title>Configuraciones</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">
  <ion-header collapse="condense">
    <ion-toolbar>
      <ion-title size="large">configuration</ion-title>
    </ion-toolbar>
  </ion-header>
  <ion-item>
    <ion-toggle (ionChange)="guardarConfiguracion()" [(ngModel)]="configurationService.permitirEliminarInicio">Permitir
      eliminar citas en el inicio</ion-toggle>
  </ion-item>
</ion-content>
