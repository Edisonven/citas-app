<ion-card>
  <ion-card-header>
    <ion-card-title>Crear una nueva cita</ion-card-title>
  </ion-card-header>

  <ion-card-content>
    <ion-list>
      <ion-item>
        <ion-input type="text" [(ngModel)]="citaStr" label="Cita:" minlength="5" placeholder="Escribe una cita..."
          required="true" #citaInput="ngModel" />
      </ion-item>
      <ion-text [hidden]="citaInput.valid || citaInput.pristine " color="danger">La cita debe tener un mínimo de 5
        caracteres.</ion-text>
      <ion-item>
        <ion-input type="text" [(ngModel)]="autorStr" label="Autor:" required minlength="2"
          placeholder="Escribe su autor..." #autorInput="ngModel" />
      </ion-item>
      <ion-text [hidden]="autorInput.valid || autorInput.pristine" color="danger">El autor debe tener un mínimo de 2
        caracteres.</ion-text>
    </ion-list>
    <ion-buttons>
      <ion-button [disabled]="!citaInput.valid || !autorInput.valid" (click)="addNewCita()" color="primary">
        <ion-text>Agregar</ion-text>
        <ion-icon name="add-outline"></ion-icon>
      </ion-button>
    </ion-buttons>
  </ion-card-content>
</ion-card>
